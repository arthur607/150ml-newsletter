services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: curator
      POSTGRES_PASSWORD: curator
      POSTGRES_DB: curator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curator"]
      interval: 5s
      timeout: 5s
      retries: 5

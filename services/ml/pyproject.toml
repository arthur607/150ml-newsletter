[project]
name = "briefing-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "umap-learn>=0.5",
  "hdbscan>=0.8",
  "numpy>=1.26",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
